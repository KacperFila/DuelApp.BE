name: Build, Migrate, and Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "infra/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in Docker to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          IMAGE_NAME=duelapp
          IMAGE_TAG=${{ github.sha }}
          IMAGE=$IMAGE_NAME:$IMAGE_TAG
          ACR_IMAGE=${{ vars.ACR_LOGIN_SERVER }}/$IMAGE

          docker build -t $IMAGE -f Dockerfile .

          docker tag $IMAGE $ACR_IMAGE

          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "ACR_IMAGE=$ACR_IMAGE" >> $GITHUB_ENV

      - name: Push Docker image
        run: docker push ${{ env.ACR_IMAGE }}

      - name: Set image tag output
        id: set-image
        run: echo "image=${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

  migrate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get DB connection string from Key Vault
        id: get-connection
        run: |
          CONNECTION_STRING=$(az keyvault secret show \
            --vault-name ${{ vars.AZURE_KEY_VAULT_NAME }} \
            --name "postgres-connection-string" \
            --query value -o tsv)
          echo "::add-mask::$CONNECTION_STRING"
          echo "CONNECTION_STRING=$CONNECTION_STRING" >> $GITHUB_ENV

      - name: Publish migrations CLI
        run: |
          cd tools/migrator
          dotnet publish DuelApp.Migrator.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o ./publish

      - name: Run migrations
        run: ./tools/migrator/publish/DuelApp.Migrator -c "${{ env.CONNECTION_STRING }}"

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container image to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: staging-duelapp-be
          images: ${{ vars.ACR_LOGIN_SERVER }}/duelapp:${{ needs.build.outputs.image }}

      - name: Update staging.tfvars with new image
        working-directory: infra/staging
        run: |
          IMAGE="${{ needs.build.outputs.image }}"
          sed -i "s|^image_tag *= *\".*\"|image_tag = \"$IMAGE\"|" staging.tfvars

      - name: Commit updated staging.tfvars
        working-directory: infra/staging
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add staging.tfvars
          git commit -m "chore: update docker image to ${{ needs.build.outputs.image }}" || echo "No changes to commit"
          git push
